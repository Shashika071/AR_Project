<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>WebXR AR — Marker / Markerless</title>

  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- Early global error surfacing so we can see JS errors on phone as a toast -->
  <script>
    (function () {
      function showErr (msg) {
        var el = document.createElement('div');
        el.textContent = '⚠️ ' + msg;
        el.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;z-index:99999;' +
          'background:rgba(220,50,50,.95);color:#fff;font:13px system-ui;padding:10px 12px;' +
          'border-radius:10px;max-height:40vh;overflow:auto;white-space:pre-wrap;';
        el.addEventListener('click', function () { el.remove(); });
        document.body ? document.body.appendChild(el) : document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(el); });
      }
      window.addEventListener('error', function (e) {
        showErr((e.message || 'Error') + '\n' + (e.filename || '') + ':' + (e.lineno || '?'));
      });
      window.addEventListener('unhandledrejection', function (e) {
        showErr('Promise: ' + ((e.reason && (e.reason.message || e.reason)) || 'unknown'));
      });
    })();
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #071018;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    body.ar-live { background: transparent; }

    #marker-scene {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      z-index: 1;
      visibility: hidden;
    }
    #marker-scene.active { visibility: visible; }

    #markerless-wrap {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      display: none;
      z-index: 1;
    }

    #marker-scene canvas,
    #marker-scene .a-canvas,
    #markerless-scene canvas,
    #markerless-scene .a-canvas {
      background: transparent !important;
    }

    #marker-scene video {
      position: fixed !important;
      top: 0 !important; left: 0 !important;
      width: 100% !important; height: 100% !important;
      object-fit: cover !important;
      z-index: 0 !important;
    }

    #ml-camera {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      background: #000;
    }

    #ml-scene-host,
    #ml-scene-host a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: transparent !important;
    }

    /* ── Start screen ── */
    #start-screen {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background:
        radial-gradient(circle at top, rgba(0, 170, 255, 0.28), transparent 42%),
        linear-gradient(180deg, #071018 0%, #0d2438 55%, #12344f 100%);
      color: #fff;
    }
    #start-screen.hidden { display: none; }

    .start-card {
      width: min(440px, 100%);
      text-align: center;
    }
    .start-card h1 {
      font-size: clamp(26px, 8vw, 38px);
      margin-bottom: 8px;
    }
    .start-card p {
      opacity: .75;
      font-size: clamp(13px, 3.5vw, 16px);
      margin-bottom: 22px;
      line-height: 1.45;
    }

    .mode-btn {
      width: 100%;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 18px;
      padding: 16px 14px;
      margin-bottom: 12px;
      color: #fff;
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
      text-align: left;
    }
    .mode-btn strong {
      display: block;
      font-size: clamp(16px, 4.5vw, 20px);
      margin-bottom: 4px;
    }
    .mode-btn span {
      display: block;
      opacity: .72;
      font-size: clamp(12px, 3.2vw, 14px);
      line-height: 1.35;
    }
    .mode-btn.primary {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      border-color: transparent;
    }

    /* ── Top UI ── */
    #ui-overlay {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      background: linear-gradient(180deg, rgba(0,0,0,.75) 0%, transparent 100%);
      pointer-events: none;
    }
    #ui-overlay.visible { display: flex; }
    #ui-overlay > * { pointer-events: all; }

    #app-title {
      color: #fff;
      font-size: clamp(12px, 3.2vw, 15px);
      font-weight: 700;
      text-shadow: 0 1px 4px rgba(0,0,0,.8);
      white-space: nowrap;
    }

    #live-weather {
      color: #fff;
      font-size: clamp(10px, 2.8vw, 12px);
      background: rgba(0,0,0,.45);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 14px;
      padding: 6px 8px;
      max-width: 46vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #home-btn {
      border: none;
      border-radius: 14px;
      padding: 7px 10px;
      background: rgba(255,255,255,.16);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    #city-tabs {
      position: fixed;
      top: 58px; left: 0; right: 0;
      z-index: 998;
      display: none;
      justify-content: center;
      gap: 8px;
      padding: 8px 10px;
      flex-wrap: wrap;
    }
    #city-tabs.visible { display: flex; }

    .city-tab {
      padding: 6px 12px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 16px;
      background: rgba(10,14,30,.7);
      color: rgba(255,255,255,.75);
      font-size: clamp(11px, 3vw, 13px);
      cursor: pointer;
    }
    .city-tab.active {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #fff;
      border-color: transparent;
    }

    #toast {
      position: fixed; top: 70px; left: 50%;
      transform: translateX(-50%); z-index: 1002;
      background: rgba(0,150,80,.9); color: #fff;
      padding: 10px 20px; border-radius: 10px;
      font-size: 13px; max-width: 88vw; text-align: center;
      opacity: 0; pointer-events: none; transition: opacity .3s;
    }
    #toast.show { opacity: 1; }

    #mode-hint {
      position: fixed;
      bottom: max(18px, env(safe-area-inset-bottom, 18px));
      left: 50%; transform: translateX(-50%);
      z-index: 998; color: rgba(255,255,255,.75);
      font-size: clamp(11px, 3vw, 13px);
      text-align: center; pointer-events: none;
      text-shadow: 0 1px 4px #000;
      width: 92vw;
      display: none;
    }
    #mode-hint.visible { display: block; }

    /* Lightning flash for Thunderstorm */
    #screen-flash {
      position: fixed;
      inset: 0;
      background: #eaf1ff;
      opacity: 0;
      pointer-events: none;
      z-index: 6;
      mix-blend-mode: screen;
      transition: opacity 60ms ease-out;
    }
    #screen-flash.flash { opacity: .85; }

    /* Fog vignette for Mist/Fog/Haze */
    #fog-overlay {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at center, rgba(210,220,230,0) 20%, rgba(210,220,230,.55) 90%);
      opacity: 0;
      pointer-events: none;
      z-index: 4;
      transition: opacity .4s ease;
    }
    #fog-overlay.visible { opacity: 1; }

    /* Sunny warm tint */
    #sun-tint {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 70% 20%, rgba(255,210,120,.18), transparent 55%);
      opacity: 0;
      pointer-events: none;
      z-index: 4;
      transition: opacity .5s ease;
    }
    #sun-tint.visible { opacity: 1; }

    /* Rainy blue tint */
    #rain-tint {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, rgba(20,40,80,.25), rgba(20,40,80,.05));
      opacity: 0;
      pointer-events: none;
      z-index: 4;
      transition: opacity .4s ease;
    }
    #rain-tint.visible { opacity: 1; }

    /* Mute + AR launch button */
    #mute-btn, #ar-btn {
      background: rgba(10,14,30,.7);
      border: 1px solid rgba(255,255,255,.25);
      color: #fff;
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 13px;
      cursor: pointer;
      margin-left: 6px;
    }
    #ar-btn {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      border-color: transparent;
      font-weight: 700;
    }
    #mute-btn.muted { opacity: .55; }

    /* Centered Start AR — pick city + hour first, then tap this */
    #ar-center {
      position: fixed;
      inset: 0;
      z-index: 1010;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      padding: 24px 16px;
    }
    #ar-center.visible { display: flex; }
    #ar-center-card {
      pointer-events: auto;
      width: min(360px, 92vw);
      text-align: center;
      background: rgba(8, 16, 32, .82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 22px;
      padding: 22px 18px 18px;
      box-shadow: 0 12px 40px rgba(0,0,0,.45);
    }
    #ar-center-card p {
      color: rgba(255,255,255,.85);
      font-size: clamp(13px, 3.5vw, 15px);
      line-height: 1.45;
      margin-bottom: 16px;
    }
    #ar-center-card .pick {
      color: #7ee0ff;
      font-weight: 700;
      font-size: clamp(14px, 4vw, 16px);
      margin-bottom: 14px;
    }
    #ar-center-btn {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 16px 18px;
      font-size: clamp(16px, 4.5vw, 20px);
      font-weight: 800;
      color: #fff;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,114,255,.45);
    }
    #ar-center-btn:active { transform: scale(.98); }

    /* 2D center placement marker — always visible while scanning a surface */
    #place-marker {
      position: fixed;
      left: 50%;
      top: 48%;
      transform: translate(-50%, -50%);
      z-index: 1008;
      width: 72px;
      height: 72px;
      pointer-events: none;
      display: none;
    }
    #place-marker.visible { display: block; }
    #place-marker .ring {
      position: absolute;
      inset: 0;
      border: 3px solid #00c6ff;
      border-radius: 50%;
      box-shadow: 0 0 16px rgba(0,198,255,.8);
      animation: markerPulse 1.2s ease-in-out infinite;
    }
    #place-marker .dot {
      position: absolute;
      left: 50%; top: 50%;
      width: 10px; height: 10px;
      margin: -5px 0 0 -5px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 10px #00c6ff;
    }
    #place-marker .cross-h,
    #place-marker .cross-v {
      position: absolute;
      background: rgba(255,255,255,.85);
      left: 50%; top: 50%;
    }
    #place-marker .cross-h { width: 28px; height: 2px; margin: -1px 0 0 -14px; }
    #place-marker .cross-v { width: 2px; height: 28px; margin: -14px 0 0 -1px; }
    @keyframes markerPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.12); opacity: .7; }
    }

    /* DOM overlay container used by WebXR while the AR session is active.
       Empty by default — UI panels stay in normal document flow.
       The overlay is invisible/pass-through when not in XR. */
    #ml-dom-overlay { position: absolute; inset: 0; pointer-events: none; }

    /* Last 12 hours history strip */
    #history-strip {
      position: fixed;
      bottom: max(60px, calc(env(safe-area-inset-bottom, 12px) + 52px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 1005;
      display: none;
      flex-wrap: nowrap;
      gap: 6px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 8px 10px;
      background: rgba(10,14,30,.78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 18px;
      max-width: 94vw;
      scrollbar-width: none;
      box-shadow: 0 4px 20px rgba(0,0,0,.5);
      pointer-events: auto;
      touch-action: pan-x;
      -webkit-overflow-scrolling: touch;
    }
    #history-strip::-webkit-scrollbar { display: none; }
    #history-strip.visible { display: flex; }
    .hist-cell.selected {
      background: linear-gradient(135deg, rgba(255,180,60,.4), rgba(255,120,40,.4)) !important;
      border-color: rgba(255,180,60,.85) !important;
      box-shadow: 0 0 0 2px rgba(255,180,60,.35);
    }
    .hist-cell {
      min-width: 54px;
      text-align: center;
      color: #fff;
      font-size: 11px;
      padding: 6px 6px;
      border-radius: 10px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      flex: 0 0 auto;
      line-height: 1.15;
      cursor: pointer;
      -webkit-tap-highlight-color: rgba(0,198,255,.35);
      touch-action: manipulation;
    }
    .hist-cell:active { background: rgba(0,198,255,.25); }
    .hist-cell .h { opacity: .7; font-size: 10px; }
    .hist-cell .e { font-size: 15px; margin: 2px 0; }
    .hist-cell .t { font-weight: 700; font-size: 12px; }
    .hist-cell.now {
      background: linear-gradient(135deg, rgba(0,198,255,.35), rgba(0,114,255,.35));
      border-color: rgba(0,198,255,.6);
    }
  </style>
</head>
<body>

<!-- ── START: choose mode ── -->
<div id="start-screen">
  <div class="start-card">
    <h1>🌐 City AR</h1>
    <p>Select what you need when the app starts</p>

    <button class="mode-btn primary" onclick="startMode('marker')">
      <strong>🎯 Marker AR</strong>
      <span>Point camera at one printed image, then tap a city tab to switch model + weather</span>
    </button>

    <button class="mode-btn" onclick="startMode('markerless')">
      <strong>📱 Markerless AR</strong>
      <span>Pick a city + weather hour, then tap Start AR and place it on a floor or table</span>
    </button>
  </div>
</div>

<!-- ── MARKER AR SCENE ── -->
<a-scene
  id="marker-scene"
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no;"
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true;"
  embedded
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>
  <a-assets timeout="60000">
    <a-asset-item id="model-0" src="./models/colombo_city.glb"></a-asset-item>
    <a-asset-item id="model-1" src="./models/london_city.glb"></a-asset-item>
    <a-asset-item id="model-2" src="./models/new_york_city.glb"></a-asset-item>
    <a-asset-item id="model-3" src="./models/san_francisco_city.glb"></a-asset-item>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- One image target — switch cities with the tabs UI -->
  <a-entity id="marker-target" mindar-image-target="targetIndex: 0">
    <a-entity id="marker-rotator" touch-rotate>
      <a-entity id="marker-city-0" visible="true">
        <a-entity class="ar-model" gltf-model="#model-0" fit-to-marker="size: 0.85; fallback: 0.04"></a-entity>
      </a-entity>
      <a-entity id="marker-city-1" visible="false">
        <a-entity class="ar-model" gltf-model="#model-1" fit-to-marker="size: 0.75; fallback: 0.08; offsetY: -0.1"></a-entity>
      </a-entity>
      <a-entity id="marker-city-2" visible="false">
        <a-entity class="ar-model" gltf-model="#model-2" fit-to-marker="size: 1.1; fallback: 0.03"></a-entity>
      </a-entity>
      <a-entity id="marker-city-3" visible="false">
        <a-entity class="ar-model" gltf-model="#model-3" fit-to-marker="size: 1.1; fallback: 0.04"></a-entity>
      </a-entity>
    </a-entity>
    <a-entity class="ar-rain" weather-rain position="0 0.55 0"></a-entity>
    <a-entity class="ar-sun" sun-rays visible="false" position="0.35 0.85 -0.05">
      <a-sphere radius="0.08" color="#ffd54a" material="shader: flat; emissive: #ffcc33; emissiveIntensity: 1.6"></a-sphere>
      <a-entity light="type: point; color: #ffd27a; intensity: 1.3; distance: 3"></a-entity>
    </a-entity>
    <a-entity class="ar-cloud" cloud-drift visible="false" position="0 0.85 0" scale="0.22 0.15 0.22">
      <a-sphere position="-0.6 0 0" radius="0.75" color="#c9d3e3" opacity="0.82" material="transparent: true; shader: flat"></a-sphere>
      <a-sphere position="0.15 0.15 -0.1" radius="0.9" color="#e0e7f2" opacity="0.82" material="transparent: true; shader: flat"></a-sphere>
      <a-sphere position="0.7 0 0.05" radius="0.7" color="#c9d3e3" opacity="0.82" material="transparent: true; shader: flat"></a-sphere>
      <a-sphere position="-0.2 -0.15 0.15" radius="0.6" color="#b7c2d4" opacity="0.72" material="transparent: true; shader: flat"></a-sphere>
    </a-entity>
    <a-entity class="ar-panel" position="0 0.55 0">
      <a-text id="marker-city-text" class="ar-city-text" value="Colombo" align="center" color="#ffffff" width="0.9" position="0 0.03 0" scale="0.45 0.45 0.45"></a-text>
      <a-text id="marker-wx-text" class="ar-wx-text" value="—" align="center" color="#00c6ff" width="0.9" position="0 -0.03 0" scale="0.35 0.35 0.35"></a-text>
    </a-entity>
  </a-entity>

  <a-entity id="dir-light-marker" light="type: directional; intensity: 1.0; color: #ffffff" position="1 2 1"></a-entity>
  <a-entity id="amb-light-marker" light="type: ambient; intensity: 0.4; color: #b0c4de"></a-entity>
</a-scene>

<!-- ── MARKERLESS AR (scene created on demand so Marker camera is not blocked) ── -->
<div id="markerless-wrap">
  <video id="ml-camera" playsinline webkit-playsinline autoplay muted></video>
  <div id="ml-scene-host"></div>
  <!-- DOM overlay for WebXR (city tabs / UI stay visible inside AR session) -->
  <div id="ml-dom-overlay"></div>
</div>

<div id="ui-overlay">
  <span id="app-title">🌐 City AR</span>
  <span id="live-weather">—</span>
  <button id="mute-btn" onclick="toggleMute()" title="Sound">🔊</button>
  <button id="home-btn" onclick="goHome()">Home</button>
</div>

<div id="city-tabs">
  <button class="city-tab active" onclick="selectCity(0)">🌴 Colombo</button>
  <button class="city-tab" onclick="selectCity(1)">🎡 London</button>
  <button class="city-tab" onclick="selectCity(2)">🗽 New York</button>
  <button class="city-tab" onclick="selectCity(3)">🌉 San Francisco</button>
</div>

<p id="mode-hint"></p>
<div id="ar-center">
  <div id="ar-center-card">
    <p>1. Tap a <b>city</b> at the top<br>2. Tap a <b>weather hour</b> at the bottom<br>3. Then start AR and tap the floor</p>
    <div class="pick" id="ar-pick-summary">🌴 Colombo · Now</div>
    <button id="ar-center-btn" onclick="enterMarkerlessARClick()">🚀 Start AR</button>
  </div>
</div>
<div id="place-marker">
  <div class="ring"></div>
  <div class="cross-h"></div>
  <div class="cross-v"></div>
  <div class="dot"></div>
</div>
<div id="history-strip"></div>
<div id="toast"></div>
<div id="screen-flash"></div>
<div id="fog-overlay"></div>
<div id="sun-tint"></div>
<div id="rain-tint"></div>

<script>
(function registerARComponents () {
  const THREE = AFRAME.THREE;

  AFRAME.registerComponent('fit-to-marker', {
    schema: {
      size: { type: 'number', default: 0.85 },
      fallback: { type: 'number', default: 0.05 },
      offsetY: { type: 'number', default: 0 }
    },
    init: function () {
      this.fitted = false;
      this.onLoaded = () => { this.fitted = false; this.fit(); };
      this.el.addEventListener('model-loaded', this.onLoaded);
      this.el.object3D.scale.set(this.data.fallback, this.data.fallback, this.data.fallback);
      if (this.el.getObject3D('mesh')) setTimeout(() => this.fit(), 50);
    },
    getLocalBox: function (model) {
      const box = new THREE.Box3();
      const tmpBox = new THREE.Box3();
      const tmpMat = new THREE.Matrix4();
      model.traverse((node) => {
        const geom = node.geometry;
        if (!geom) return;
        if (typeof geom.computeBoundingBox === 'function') geom.computeBoundingBox();
        if (!geom.boundingBox || geom.boundingBox.isEmpty()) return;
        tmpMat.identity();
        let current = node;
        while (current && current !== model.parent) {
          current.updateMatrix();
          tmpMat.premultiply(current.matrix);
          current = current.parent;
        }
        tmpBox.copy(geom.boundingBox).applyMatrix4(tmpMat);
        if (box.isEmpty()) box.copy(tmpBox);
        else box.union(tmpBox);
      });
      return box;
    },
    fit: function () {
      const model = this.el.getObject3D('mesh');
      if (!model) return;
      try {
        this.el.object3D.scale.set(1, 1, 1);
        this.el.object3D.position.set(0, 0, 0);
        let box = this.getLocalBox(model);
        if (box.isEmpty()) {
          model.updateMatrixWorld(true);
          box = new THREE.Box3().setFromObject(model);
        }
        const sizeVec = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(sizeVec.x, sizeVec.y, sizeVec.z);
        if (!box.isEmpty() && maxDim && isFinite(maxDim)) {
          const scale = this.data.size / maxDim;
          this.el.object3D.scale.set(scale, scale, scale);
          const center = box.getCenter(new THREE.Vector3());
          // Save "unit" offsets so pinch-zoom can recompute the position
          // and keep the model anchored on the marker instead of drifting.

      const hp = ctx.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 500;
      const g = ctx.createGain(); g.gain.value = 0;
      noise.connect(hp); hp.connect(bp); bp.connect(g); g.connect(master);
      noise.start();
      g.gain.linearRampToValueAtTime(0.7 * intensity, ctx.currentTime + 0.9);
      return { stop: function () {
        const t = ctx.currentTime;
        g.gain.cancelScheduledValues(t);
        g.gain.linearRampToValueAtTime(0, t + 0.6);
        setTimeout(function(){ try{ noise.stop(); }catch(e){} }, 700);
      }};
    }

    function thunderLoop () {
      let alive = true;
      function rumble () {
        if (!alive) return;
        const now = ctx.currentTime;
        const dur = 1.8 + Math.random()*1.4;
        const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate*dur), ctx.sampleRate);
        const d = buf.getChannelData(0);
        let last = 0;
        for (let i = 0; i < d.length; i++) {
          const w = Math.random()*2-1;
          last = (last + 0.02*w)/1.02;
          d[i] = last*3.5;
        }
        const src = ctx.createBufferSource(); src.buffer = buf;
        const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=180;
        const g = ctx.createGain(); g.gain.value = 0;
        src.connect(lp); lp.connect(g); g.connect(master);
        src.start(now);
        g.gain.linearRampToValueAtTime(1.4, now + 0.25);
        g.gain.linearRampToValueAtTime(0, now + dur);
        setTimeout(function(){ try{src.stop();}catch(e){} }, (dur+0.2)*1000);
        const next = 3500 + Math.random()*6500;
        setTimeout(rumble, next);
      }
      setTimeout(rumble, 900 + Math.random()*1500);
      return { stop: function(){ alive = false; } };
    }

    function windLayer (intensity) {
      const noise = makeNoise('pink');
      const lp = ctx.createBiquadFilter();
      lp.type='lowpass'; lp.frequency.value=500;
      const g = ctx.createGain(); g.gain.value = 0;
      noise.connect(lp); lp.connect(g); g.connect(master);
      noise.start();
      g.gain.linearRampToValueAtTime(0.45 * intensity, ctx.currentTime + 1.2);
      const lfo = ctx.createOscillator(); lfo.frequency.value = 0.22;
      const lfoGain = ctx.createGain(); lfoGain.gain.value = 260;
      lfo.connect(lfoGain); lfoGain.connect(lp.frequency);
      lfo.start();
      return { stop: function () {
        const t = ctx.currentTime;
        g.gain.cancelScheduledValues(t);
        g.gain.linearRampToValueAtTime(0, t + 0.8);
        setTimeout(function(){ try{noise.stop(); lfo.stop();}catch(e){} }, 900);
      }};
    }

    function birdsLayer () {
      let alive = true;
      function chirp () {
        if (!alive) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator(); osc.type = 'sine';
        const start = 1800 + Math.random()*1400;
        osc.frequency.setValueAtTime(start, now);
        osc.frequency.linearRampToValueAtTime(start + 400 + Math.random()*800, now + 0.11);
        const g = ctx.createGain(); g.gain.value = 0;
        osc.connect(g); g.connect(master);
        g.gain.linearRampToValueAtTime(0.12, now + 0.02);
        g.gain.linearRampToValueAtTime(0, now + 0.15);
        osc.start(now); osc.stop(now + 0.2);
        setTimeout(chirp, 700 + Math.random()*2500);
      }
      setTimeout(chirp, 300);
      return { stop: function(){ alive = false; } };
    }

    function stopCurrent () {
      try { current.stop(); } catch(e){}
      current = { stop: function(){} };
    }

    function play (cond) {
      if (!ensure()) return;
      if (cond === lastCond) return;
      lastCond = cond;
      stopCurrent();
      if (muted) return;
      if (cond === 'Rain') current = rainLayer(1.0);
      else if (cond === 'Drizzle') current = rainLayer(0.55);
      else if (cond === 'Thunderstorm') {
        const rain = rainLayer(1.15);
        const th = thunderLoop();
        current = { stop: function(){ rain.stop(); th.stop(); } };
      }
      else if (cond === 'Snow') current = windLayer(0.5);
      else if (cond === 'Clouds' || cond === 'Mist' || cond === 'Fog' || cond === 'Haze') current = windLayer(0.35);
      else if (cond === 'Clear') current = birdsLayer();
      else current = { stop: function(){} };
    }

    function stop () {
      stopCurrent();
      lastCond = null;
    }

    function setMuted (m) {
      muted = !!m;
      if (master) master.gain.value = muted ? 0 : 1.0;
      if (muted) { stopCurrent(); lastCond = null; }
    }

    return {
      play: play, stop: stop, setMuted: setMuted,
      isMuted: function(){ return muted; }
    };
  })();

  window.toggleMute = function () {
    const nowMuted = !WeatherAudio.isMuted();
    WeatherAudio.setMuted(nowMuted);
    const btn = document.getElementById('mute-btn');
    if (btn) {
      btn.textContent = nowMuted ? '🔇' : '🔊';
      btn.classList.toggle('muted', nowMuted);
    }
    if (!nowMuted) {

      const idx = currentMode === 'marker' ? markerCityIdx : mlCityIdx;
      const data = weatherCache[CITIES[idx].name];
      if (data) WeatherAudio.play(data.weather[0].main);

  /* ─────────── Last 12 hours history (Open-Meteo, no API key) ─────────── */
  async function fetchHistoryForCity (idx) {
    const city = CITIES[idx];
    if (historyCache[city.name]) return historyCache[city.name];
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}`
                + `&hourly=temperature_2m,weathercode&past_hours=12&forecast_hours=1&timezone=auto`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const times = (data.hourly && data.hourly.time) || [];
      const temps = (data.hourly && data.hourly.temperature_2m) || [];
      const codes = (data.hourly && data.hourly.weathercode) || [];
      const items = [];
      const start = Math.max(0, times.length - 13);
      for (let i = start; i < times.length; i++) {
        items.push({
          time: times[i],
          temp: temps[i],
          cond: weatherCodeToCondition(codes[i])
        });
      }
      historyCache[city.name] = items;
      return items;
    } catch (err) {
      // fake fallback
      const items = [];
      const now = new Date();
      for (let h = 12; h >= 0; h--) {
        const t = new Date(now.getTime() - h * 3600 * 1000);
        items.push({
          time: t.toISOString(),
          temp: 22 + Math.round(Math.sin(h/2)*3),
          cond: 'Clouds'
        });
      }
      historyCache[city.name] = items;
      return items;
    }
  }

  function formatHour (iso) {
    try {
      const d = new Date(iso);
      let h = d.getHours();
      const ampm = h >= 12 ? 'pm' : 'am';
      h = h % 12 || 12;
      return h + ampm;
    } catch (e) { return ''; }
  }

  // Apply a specific hour's weather (from history) to the active AR view.
  // If the tapped hour is the "now" cell, restore the live current-weather.
  function updatePickSummary () {
    const el = document.getElementById('ar-pick-summary');
    if (!el) return;
    const city = CITIES[mlCityIdx];
    if (mlHourPick.isNow || !mlHourPick.item) {
      const live = weatherCache[city.name];
      const cond = live && live.weather && live.weather[0] ? live.weather[0].main : 'Now';
      const temp = live && live.main ? Math.round(live.main.temp) + '°C' : '';
      el.textContent = `${city.emoji} ${city.name} · Live ${conditionEmoji(cond)} ${temp}`.trim();
    } else {
      const it = mlHourPick.item;
      el.textContent = `${city.emoji} ${city.name} · ${formatHour(it.time)} ${conditionEmoji(it.cond)} ${Math.round(it.temp)}°C`;
    }
  }

  function weatherPayloadForPick (idx) {
    const city = CITIES[idx];
    if (!mlHourPick.isNow && mlHourPick.item) {
      const it = mlHourPick.item;
      return {
        name: city.name,
        main: { temp: it.temp, feels_like: it.temp, humidity: 50 },
        wind: { speed: 0 },
        weather: [{ main: it.cond, description: it.cond.toLowerCase() }]
      };
    }
    return weatherCache[city.name] || {
      name: city.name,
      main: { temp: 22, feels_like: 22, humidity: 50 },
      wind: { speed: 0 },
      weather: [{ main: 'Clear', description: 'clear sky' }]
    };
  }

  window.applyPlacedWeather = function () {
    if (currentMode !== 'markerless') return;
    const idx = mlCityIdx;
    for (let i = 0; i < CITIES.length; i++) {
      const cityWrap = document.getElementById('ml-city-' + i);
      if (cityWrap) cityWrap.setAttribute('visible', i === idx);
    }
    const d = weatherPayloadForPick(idx);
    updateMarkerlessPanel(idx, d);
    WeatherAudio.play(d.weather[0].main);
  };

  async function applyHistoryHour (item, isNow) {
    const cityIdx = currentMode === 'marker' ? markerCityIdx : mlCityIdx;
    const cityName = CITIES[cityIdx].name;

    if (currentMode === 'markerless') {
      mlHourPick = { isNow: !!isNow, item: isNow ? null : item };
      updatePickSummary();
    }

    if (isNow) {
      const live = weatherCache[cityName] || await fetchWeatherForCity(cityIdx);
      if (currentMode === 'marker') updateMarkerPanel(cityIdx, live);
      else {
        updateMarkerlessPanel(cityIdx, live);
        WeatherAudio.play(live.weather[0].main);
      }
      showToast(`Live · ${CITIES[cityIdx].emoji} ${cityName}`, 1500);
      return;
    }

    const synthetic = {
      name: cityName,
      main: { temp: item.temp, feels_like: item.temp, humidity: 50 },
      wind: { speed: 0 },
      weather: [{ main: item.cond, description: item.cond.toLowerCase() }]
    };
    if (currentMode === 'marker') updateMarkerPanel(cityIdx, synthetic);
    else {
      updateMarkerlessPanel(cityIdx, synthetic);
      WeatherAudio.play(item.cond);
    }
    showToast(`${formatHour(item.time)} · ${conditionEmoji(item.cond)} ${item.cond} · ${Math.round(item.temp)}°C`, 2200);
  }

  function renderHistory (items) {
    const strip = document.getElementById('history-strip');
    if (!strip) return;
    strip.innerHTML = '';
    const total = items.length;
    items.forEach(function (it, i) {
      const isNow = (i === total - 1);
      const cell = document.createElement('div');
      cell.className = 'hist-cell' + (isNow ? ' now' : '');
      cell.innerHTML =
        '<div class="h">' + (isNow ? 'Now' : formatHour(it.time)) + '</div>' +
        '<div class="e">' + conditionEmoji(it.cond) + '</div>' +
        '<div class="t">' + Math.round(it.temp) + '°</div>';
      cell.addEventListener('click', function (ev) {
        ev.stopPropagation();
        strip.querySelectorAll('.hist-cell').forEach(function (c) { c.classList.remove('selected'); });
        if (!isNow) cell.classList.add('selected');
        applyHistoryHour(it, isNow);
      });
      strip.appendChild(cell);
    });
    strip.classList.add('visible');
    // auto-scroll to latest
    strip.scrollLeft = strip.scrollWidth;
  }

  // Stop touch events on UI widgets from reaching the touch-rotate window listener
  function guardUITouches () {
    const sels = ['#history-strip', '#city-tabs', '#ui-overlay', '#toast', '#mute-btn', '#home-btn', '#ar-center'];
    sels.forEach(function (sel) {
      const el = document.querySelector(sel);
      if (!el) return;
      ['touchstart','touchmove','touchend','click'].forEach(function (evName) {
        el.addEventListener(evName, function (e) { e.stopPropagation(); }, { passive: true });
      });
    });
  }
  document.addEventListener('DOMContentLoaded', guardUITouches);
  // also guard dynamically-added .hist-cell via delegation on strip (already done above)


  async function showHistoryFor (idx) {
    const items = await fetchHistoryForCity(idx);
    renderHistory(items);
  }


  let toastTimer;
  function showToast (msg, dur = 3000) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), dur);
  }

  const screenFlash = document.getElementById('screen-flash');
  const fogOverlay = document.getElementById('fog-overlay');
  const sunTint = document.getElementById('sun-tint');
  const rainTint = document.getElementById('rain-tint');

  let lightningTimer = null;
  function stopLightning () {
    if (lightningTimer) { clearTimeout(lightningTimer); lightningTimer = null; }
    if (screenFlash) screenFlash.classList.remove('flash');
  }
  function startLightning () {
    stopLightning();
    const flash = () => {
      screenFlash.classList.add('flash');
      setTimeout(() => screenFlash.classList.remove('flash'), 90);
      setTimeout(() => {
        screenFlash.classList.add('flash');
        setTimeout(() => screenFlash.classList.remove('flash'), 60);
      }, 180);
      const next = 3000 + Math.random() * 4000;
      lightningTimer = setTimeout(flash, next);
    };
    lightningTimer = setTimeout(flash, 1500);
  }

  function setOverlayTints (cond) {
    const isRain = cond === 'Rain' || cond === 'Drizzle' || cond === 'Thunderstorm';
    const isClear = cond === 'Clear';
    const isFog = cond === 'Mist' || cond === 'Fog' || cond === 'Haze';
    rainTint.classList.toggle('visible', isRain);
    sunTint.classList.toggle('visible', isClear);
    fogOverlay.classList.toggle('visible', isFog);
    if (cond === 'Thunderstorm') startLightning();
    else stopLightning();
  }

  function clearFX (root) {
    const rain = root.querySelector('.ar-rain');
    const sun = root.querySelector('.ar-sun');
    const cloud = root.querySelector('.ar-cloud');
    if (rain && rain.components['weather-rain']) rain.components['weather-rain'].setActive(false);
    if (sun) sun.setAttribute('visible', false);
    if (cloud) cloud.setAttribute('visible', false);
  }

  function applyARWeatherFX (root, cond, lightIds) {
    clearFX(root);
    const rain = root.querySelector('.ar-rain');
    const sun = root.querySelector('.ar-sun');
    const cloud = root.querySelector('.ar-cloud');

    let lightVal = 0.9, ambVal = 0.4, ambColor = '#b0c4de', dirColor = '#ffffff';

    if (cond === 'Rain' || cond === 'Drizzle' || cond === 'Thunderstorm') {
      if (rain && rain.components['weather-rain']) rain.components['weather-rain'].setActive(true, 'rain');
      if (cloud) cloud.setAttribute('visible', true);
      lightVal = cond === 'Thunderstorm' ? 0.25 : 0.4;
      ambVal = 0.22; ambColor = '#6a7a9a'; dirColor = '#9bb0c9';
    } else if (cond === 'Clear') {
      if (sun) sun.setAttribute('visible', true);
      lightVal = 1.4; ambVal = 0.65; ambColor = '#fff1c2'; dirColor = '#fff4d2';
    } else if (cond === 'Clouds') {
      if (cloud) cloud.setAttribute('visible', true);
      lightVal = 0.78; ambVal = 0.42; ambColor = '#c5d0df'; dirColor = '#d7e0ea';
    } else if (cond === 'Snow') {
      if (rain && rain.components['weather-rain']) rain.components['weather-rain'].setActive(true, 'snow');
      if (cloud) cloud.setAttribute('visible', true);
      lightVal = 0.8; ambVal = 0.55; ambColor = '#eaf2ff'; dirColor = '#e8f1ff';
    } else if (cond === 'Mist' || cond === 'Fog' || cond === 'Haze') {
      if (cloud) cloud.setAttribute('visible', true);
      lightVal = 0.55; ambVal = 0.45; ambColor = '#c8d2de'; dirColor = '#cfd7e2';
    }

    const dir = document.getElementById(lightIds.dir);
    const amb = document.getElementById(lightIds.amb);
    if (dir) dir.setAttribute('light', `type: directional; intensity: ${lightVal}; color: ${dirColor}`);
    if (amb) amb.setAttribute('light', `type: ambient; intensity: ${ambVal}; color: ${ambColor}`);

    setOverlayTints(cond);
  }

  function updateMarkerPanel (idx, d) {
    const target = document.getElementById('marker-target');
    if (!target) return;
    const cond = d.weather[0].main;
    const cityText = document.getElementById('marker-city-text');
    const wxText = document.getElementById('marker-wx-text');
    if (cityText) cityText.setAttribute('value', `${CITIES[idx].emoji} ${d.name}`);
    if (wxText) wxText.setAttribute('value',
      `${conditionEmoji(cond)} ${Math.round(d.main.temp)}°C · ${d.weather[0].description}`);
    // Only apply 3D FX / screen tints while marker is tracked (or while selecting in marker mode)
    if (currentMode === 'marker' && markerTracked) {
      applyARWeatherFX(target, cond, { dir: 'dir-light-marker', amb: 'amb-light-marker' });
      liveWeather.textContent = `${CITIES[idx].emoji} ${d.name} · ${conditionEmoji(cond)} ${Math.round(d.main.temp)}°C`;
      WeatherAudio.play(cond);
    } else if (currentMode === 'marker') {
      // Update text only; keep FX ready but don't flash screen overlays
      clearFX(target);
      liveWeather.textContent = `${CITIES[idx].emoji} ${d.name} · ${conditionEmoji(cond)} ${Math.round(d.main.temp)}°C`;
    }
  }

  function updateMarkerlessPanel (idx, d) {
    const stage = document.getElementById('ml-stage');
    const cond = d.weather[0].main;
    const cityText = document.getElementById('ml-city-text');
    const wxText = document.getElementById('ml-wx-text');
    if (cityText) cityText.setAttribute('value', `${CITIES[idx].emoji} ${d.name}`);
    if (wxText) wxText.setAttribute('value',
      `${conditionEmoji(cond)} ${Math.round(d.main.temp)}°C · ${d.weather[0].description}`);
    if (stage) applyARWeatherFX(stage, cond, { dir: 'dir-light-ml', amb: 'amb-light-ml' });
    liveWeather.textContent = `${CITIES[idx].emoji} ${d.name} · ${conditionEmoji(cond)} ${Math.round(d.main.temp)}°C`;
    WeatherAudio.play(cond);
    updatePickSummary();
  }

  async function fetchWeatherForCity (idx) {
    const city = CITIES[idx];
    try {
      const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city.name)}&appid=${API_KEY}&units=metric`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      weatherCache[city.name] = data;
      updateMarkerPanel(idx, data);
      return data;
    } catch (err) {
      const fake = {
        name: city.name,
        main: { temp: 20, feels_like: 18, humidity: 55 },
        wind: { speed: 4 },
        weather: [{ main: 'Rain', description: 'light rain' }]
      };
      weatherCache[city.name] = fake;
      updateMarkerPanel(idx, fake);
      return fake;
    }
  }

              </a-entity>
              <a-entity class="ar-panel" position="0 0.28 0">
                <a-text id="ml-city-text" value="Colombo" align="center" color="#ffffff" width="0.9" position="0 0.03 0" scale="0.4 0.4 0.4"></a-text>
                <a-text id="ml-wx-text" value="—" align="center" color="#00c6ff" width="0.9" position="0 -0.03 0" scale="0.32 0.32 0.32"></a-text>
              </a-entity>
            </a-entity>
          </a-entity>

          <a-entity id="dir-light-ml" light="type: directional; intensity: 1.0; color: #ffffff" position="1 3 1"></a-entity>
          <a-entity id="amb-light-ml" light="type: ambient; intensity: 0.55; color: #ffffff"></a-entity>
        </a-scene>`;
    }

    // Fallback (iOS Safari, older browsers): fixed-position markerless
    return `
      <a-scene id="markerless-scene" embedded vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        renderer="colorManagement: true; alpha: true; antialias: true">
        <a-assets>
          <a-asset-item id="ml-model-0" src="./models/colombo_city.glb"></a-asset-item>
          <a-asset-item id="ml-model-1" src="./models/london_city.glb"></a-asset-item>
          <a-asset-item id="ml-model-2" src="./models/new_york_city.glb"></a-asset-item>
          <a-asset-item id="ml-model-3" src="./models/san_francisco_city.glb"></a-asset-item>
        </a-assets>
        <a-camera position="0 1.4 0" look-controls="enabled: false" wasd-controls="enabled: false"></a-camera>
        <a-entity id="ml-anchor" visible="true">
          <a-entity id="ml-stage" position="0 0.9 -2.2">
            <a-entity id="ml-rotator" touch-rotate="always: true">
              ${cityWrappers}
            </a-entity>
            <a-entity class="ar-rain" weather-rain="area: 1.6; height: 1.8; count: 260; wind: 0.22" position="0 0.9 0"></a-entity>
            <a-entity class="ar-sun" sun-rays visible="false" position="0.7 1.35 -0.2">
              <a-sphere radius="0.13" color="#ffd54a" material="shader: flat; emissive: #ffcc33; emissiveIntensity: 1.7"></a-sphere>
              <a-entity light="type: point; color: #ffd27a; intensity: 1.5; distance: 6"></a-entity>
            </a-entity>
            <a-entity class="ar-cloud" cloud-drift visible="false" position="0 1.3 0" scale="0.36 0.24 0.36">
              <a-sphere position="-0.6 0 0" radius="0.75" color="#c9d3e3" opacity="0.85" material="transparent: true; shader: flat"></a-sphere>
              <a-sphere position="0.15 0.18 -0.1" radius="0.9" color="#e0e7f2" opacity="0.85" material="transparent: true; shader: flat"></a-sphere>
              <a-sphere position="0.75 0 0.05" radius="0.7" color="#c9d3e3" opacity="0.85" material="transparent: true; shader: flat"></a-sphere>
              <a-sphere position="-0.2 -0.15 0.2" radius="0.6" color="#b7c2d4" opacity="0.75" material="transparent: true; shader: flat"></a-sphere>
            </a-entity>
            <a-entity class="ar-panel" position="0 0.95 0">
              <a-text id="ml-city-text" value="Colombo" align="center" color="#ffffff" width="3" position="0 0.08 0"></a-text>
              <a-text id="ml-wx-text" value="—" align="center" color="#00c6ff" width="3" position="0 -0.08 0"></a-text>
            </a-entity>
          </a-entity>
        </a-entity>
        <a-entity id="dir-light-ml" light="type: directional; intensity: 1.0; color: #ffffff" position="1 3 1"></a-entity>
        <a-entity id="amb-light-ml" light="type: ambient; intensity: 0.45; color: #b0c4de"></a-entity>
      </a-scene>`;
  }

  let markerlessUsesXR = false;

  async function ensureMarkerlessScene () {
    if (document.getElementById('markerless-scene')) return;
    markerlessUsesXR = await isWebXRSupported();
    mlSceneHost.innerHTML = markerlessSceneHTML(markerlessUsesXR);
    return new Promise((resolve) => {
      const scene = document.getElementById('markerless-scene');
      const ready = () => {
        try { if (scene.renderer) scene.renderer.setClearColor(0x000000, 0); } catch (e) {}
        resolve();
      };
      if (scene.hasLoaded) ready();
      else scene.addEventListener('loaded', ready, { once: true });
    });
  }

  async function enterMarkerlessAR () {
    const scene = document.getElementById('markerless-scene');
    if (!scene) return;
    if (!markerlessUsesXR) return; // fallback mode does not need enter
    try {
      // A-Frame provides enterAR() when webxr feature is set
      if (typeof scene.enterAR === 'function') await scene.enterAR();
      else if (scene.renderer && scene.renderer.xr) {
        const session = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['hit-test'],
          optionalFeatures: ['local-floor']
        });
        await scene.renderer.xr.setSession(session);
      }
    } catch (err) {
      showToast('⚠️ Could not start AR: ' + (err && err.message ? err.message : ''), 4000);
    }
  }

  async function startMarkerlessCamera () {
    if (mlStream) return;
    mlStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' } }
    });
    mlCamera.setAttribute('playsinline', '');
    mlCamera.setAttribute('webkit-playsinline', '');
    mlCamera.muted = true;
    mlCamera.srcObject = mlStream;
    await mlCamera.play();
  }

  function stopMarkerlessCamera () {
    if (!mlStream) return;
    mlStream.getTracks().forEach((t) => t.stop());
    mlStream = null;
    mlCamera.srcObject = null;
  }

  function stopMindAR () {
    try {
      const sys = markerScene.systems && markerScene.systems['mindar-image-system'];
      if (sys && typeof sys.stop === 'function') sys.stop();
      const comp = markerScene.components['mindar-image'];
      if (comp && typeof comp.stop === 'function') comp.stop();
    } catch (e) {}
    markerScene.classList.remove('active');
  }

  function startMindAR () {
    markerScene.classList.add('active');
    const run = () => {
      try {
        const sys = markerScene.systems && markerScene.systems['mindar-image-system'];
        if (sys && typeof sys.start === 'function') {
          sys.start();
          return;
        }
        const comp = markerScene.components['mindar-image'];
        if (comp && typeof comp.start === 'function') comp.start();
      } catch (e) {
        showToast('⚠️ Could not start Marker AR');
      }
    };
    if (markerScene.hasLoaded) setTimeout(run, 50);
    else markerScene.addEventListener('loaded', () => setTimeout(run, 50), { once: true });
  }

  window.startMode = async function (mode) {
    startScreen.classList.add('hidden');
    uiOverlay.classList.add('visible');
    modeHint.classList.add('visible');
    currentMode = mode;
    document.body.dataset.arMode = mode;
    document.body.classList.add('ar-live');

    if (mode === 'marker') {
      appTitle.textContent = '🎯 Marker AR';
      liveWeather.textContent = 'Point at the marker';
      modeHint.textContent = '📸 Point at 1 image · tap a city · 👆 rotate · 🤏 zoom';
      cityTabs.classList.add('visible');
      markerlessWrap.style.display = 'none';
      const arCenter = document.getElementById('ar-center');
      if (arCenter) arCenter.classList.remove('visible');
      stopMarkerlessCamera();
      destroyMarkerlessScene();
      startMindAR();
      selectCity(markerCityIdx);
      showToast('Marker AR — scan 1 image, then pick a city', 2800);
    } else {
      appTitle.textContent = '📱 Markerless AR';
      cityTabs.classList.add('visible');
      stopMindAR();
      markerlessWrap.style.display = 'block';
      mlHourPick = { isNow: true, item: null };
      try {
        await ensureMarkerlessScene();
        const arCenter = document.getElementById('ar-center');
        if (markerlessUsesXR) {
          stopMarkerlessCamera();
          modeHint.textContent = 'Pick city + hour, then tap Start AR in the center';
          if (arCenter) arCenter.classList.add('visible');
          showToast('Pick city + weather hour, then Start AR', 2800);
        } else {
          await startMarkerlessCamera();
          modeHint.textContent = 'Pick city + hour, then tap Start AR';
          if (arCenter) arCenter.classList.add('visible');
          showToast('Pick city + weather hour, then Start AR', 2500);
        }
        selectCity(mlCityIdx);
        updatePickSummary();
      } catch (err) {
        toast.style.background = 'rgba(220,50,50,.9)';
        showToast('⚠️ ' + (err && err.message ? err.message : 'Could not start Markerless AR'));
      }
    }
  };

  window.enterMarkerlessARClick = function () {
    const arCenter = document.getElementById('ar-center');
    if (arCenter) arCenter.classList.remove('visible');
    modeHint.textContent = '👆 Move until you see the blue marker, then tap';
    showToast('Look for the blue marker, then tap to place', 2800);
    const hud = document.getElementById('place-marker');
    if (hud) hud.classList.add('visible');
    const picked = weatherPayloadForPick(mlCityIdx);
    WeatherAudio.play(picked.weather[0].main);
    if (markerlessUsesXR) {
      enterMarkerlessAR();
    } else {
      window.applyPlacedWeather();
      const anchor = document.getElementById('ml-anchor');
      if (anchor) anchor.setAttribute('visible', true);
      if (hud) hud.classList.remove('visible');
      const reticle = document.getElementById('ml-reticle');
      if (reticle) reticle.setAttribute('visible', false);
    }
  };

  window.goHome = function () {
    stopMindAR();
    stopMarkerlessCamera();
    // End WebXR session if active
    try {
      const scene = document.getElementById('markerless-scene');
      const session = scene && scene.renderer && scene.renderer.xr && scene.renderer.xr.getSession && scene.renderer.xr.getSession();
      if (session && session.end) session.end();
    } catch (e) {}
    destroyMarkerlessScene();
    markerlessWrap.style.display = 'none';
    const arCenter = document.getElementById('ar-center');
    if (arCenter) arCenter.classList.remove('visible');
    const hud = document.getElementById('place-marker');
    if (hud) hud.classList.remove('visible');
    document.body.classList.remove('ar-live');
    uiOverlay.classList.remove('visible');
    cityTabs.classList.remove('visible');
    modeHint.classList.remove('visible');
    startScreen.classList.remove('hidden');
    currentMode = null;
    document.body.dataset.arMode = '';
    // clear atmospheric overlays + sound + history strip
    stopLightning();
    if (rainTint) rainTint.classList.remove('visible');
    if (sunTint) sunTint.classList.remove('visible');
    if (fogOverlay) fogOverlay.classList.remove('visible');
    const hist = document.getElementById('history-strip');
    if (hist) hist.classList.remove('visible');
    WeatherAudio.stop();
  };

  window.selectCity = async function (idx) {
    document.querySelectorAll('.city-tab').forEach((t, i) => t.classList.toggle('active', i === idx));

    if (currentMode === 'marker') {
      markerCityIdx = idx;
      for (let i = 0; i < CITIES.length; i++) {
        const cityWrap = document.getElementById('marker-city-' + i);
        if (cityWrap) cityWrap.setAttribute('visible', i === idx);
      }
      let data = weatherCache[CITIES[idx].name];
      if (!data) data = await fetchWeatherForCity(idx);
      else updateMarkerPanel(idx, data);
      if (markerTracked) {
        showToast(`${CITIES[idx].emoji} ${CITIES[idx].name}`, 1500);
      }
      showHistoryFor(idx);
      return;
    }

    // Markerless
    mlCityIdx = idx;
    mlHourPick = { isNow: true, item: null };
    for (let i = 0; i < CITIES.length; i++) {
      const cityWrap = document.getElementById('ml-city-' + i);
      if (cityWrap) cityWrap.setAttribute('visible', i === idx);
    }
    let data = weatherCache[CITIES[idx].name];
    if (!data) data = await fetchWeatherForCity(idx);
    updateMarkerlessPanel(idx, data);
    WeatherAudio.play(data.weather[0].main);
    updatePickSummary();
    showHistoryFor(idx);
  };

  // keep old name working if anything still calls it
  window.selectMarkerlessCity = window.selectCity;

  markerScene.addEventListener('arReady', () => {
    if (currentMode === 'marker') showToast('📸 Marker AR ready — point at your image', 2500);
  });
  markerScene.addEventListener('arError', () => {
    toast.style.background = 'rgba(220,50,50,.9)';
    showToast('⚠️ Camera permission needed');
  });

  const markerTarget = document.getElementById('marker-target');
  if (markerTarget) {
    markerTarget.addEventListener('targetFound', async () => {
      if (currentMode !== 'marker') return;
      markerTracked = true;
      const idx = markerCityIdx;
      const city = CITIES[idx];
      let data = weatherCache[city.name];
      if (!data) data = await fetchWeatherForCity(idx);
      else updateMarkerPanel(idx, data);
      const cond = data.weather[0].main;
      liveWeather.textContent = `${city.emoji} ${city.name} · ${conditionEmoji(cond)} ${Math.round(data.main.temp)}°C`;
      showToast(`${city.emoji} ${city.name} · ${conditionEmoji(cond)} ${cond}`, 2200);
      WeatherAudio.play(cond);
      showHistoryFor(idx);
    });
    markerTarget.addEventListener('targetLost', () => {
      markerTracked = false;
      stopLightning();
      if (rainTint) rainTint.classList.remove('visible');
      if (sunTint) sunTint.classList.remove('visible');
      if (fogOverlay) fogOverlay.classList.remove('visible');
      WeatherAudio.stop();
    });
  }

  window.addEventListener('load', () => {
    setTimeout(() => {
      CITIES.forEach((_, idx) => fetchWeatherForCity(idx));
    }, 1200);
  });
})();
</script>
</body>
</html>
